<!DOCTYPE html>
<html lang="en">

<head>
  <title>chirs.game</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="c.css" type="text/css" media="screen">
  <script type="text/javascript" src="coquette-min.js"></script>

  <script type="text/javascript" src="js/func.js"></script>
  <script type="text/javascript" src="js/sound.js"></script>

  <script type="text/javascript" src="js/player.js"></script>
  <script type="text/javascript" src="js/adversary.js"></script>
  <script type="text/javascript" src="js/objects.js"></script>

  <script type="text/javascript" src="js/game.js"></script>
</head>

<body>
  <div id="header">
      <p>chirs.game presents</p>
  </div>
  <button id="menu-button" type="button" hidden>← menu <span>esc</span></button>
  <button id="sound-button" type="button" aria-label="Mute sound" aria-pressed="false">sound on</button>
  <div id="game">
    <div id="selector">
    <div id="title">generic<br><span>video games</span></div>
    <ul id="gamelist">
      <li id="touch" data-game="touch" tabindex="0" role="button">
        <span class="number">01</span>
        <span class="game-name">touch</span>
        <svg class="primitive primitive-touch" viewBox="0 0 100 36" aria-hidden="true">
          <rect x="4" y="14" width="8" height="8" />
          <rect x="42" y="5" width="8" height="8" />
          <rect class="accent" x="76" y="22" width="10" height="10" />
        </svg>
      </li>
      <li id="asteroids" data-game="asteroids" tabindex="0" role="button">
        <span class="number">02</span>
        <span class="game-name">space</span>
        <svg class="primitive primitive-space" viewBox="0 0 100 44" aria-hidden="true">
          <path d="M7 22 L13 7 L29 3 L41 12 L38 29 L24 39 L10 34 Z" />
          <path class="accent" d="M70 34 L78 9 L86 34 L78 28 Z" />
        </svg>
      </li>
      <li id="ping" data-game="ping" tabindex="0" role="button">
        <span class="number">03</span>
        <span class="game-name">ping</span>
        <svg class="primitive primitive-ping" viewBox="0 0 100 40" aria-hidden="true">
          <path d="M8 5 H30 V13 H8 Z M36 5 H58 V13 H36 Z M64 5 H86 V13 H64 Z M32 36 H62" />
          <rect class="accent" x="53" y="23" width="5" height="5" />
        </svg>
      </li>
      <!--<li id="nibbles">nibbles</li>-->
      <!--<li id="pacman">pacman</li>-->
    </ul>
    </div>
    <canvas id="gameCanvas" tabindex="0" aria-label="Game playfield" hidden></canvas>
  </div>

    <div id="lose" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
      <p id="game-over-title">game over</p>
      <button id="playagain" type="button">play again <span>enter / r</span></button>
      <button id="lose-menu" type="button">back to menu <span>esc</span></button>
    </div>


</body>

</html>
